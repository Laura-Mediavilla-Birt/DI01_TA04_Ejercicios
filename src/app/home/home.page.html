<!--
  TAREA TA04 – HomePage
  Implementa los TODOs siguiendo los apartados indicados en la teoría.
-->

<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
       Mi Aplicación
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-item>
    <!-- TODO Con signals no podemos usar [(ngModel)] directamente.
       Usamos property binding [ngModel] para leer el valor del signal (busqueda())
       y event binding (ngModelChange) para actualizar el signal con .set() -->
    <!--  <ion-input [(ngModel)]="busqueda" placeholder="Buscar elemento..."></ion-input> -->
    <!-- Con signals se suele evitar el uso de ngModel, ya que esto requiere FormsModule y esto ocupa mucho-->
    <!-- Haremos uso de [value] y (ionInput)-->
    <!-- Necesitaremos ?? (nullish coalescing o coalescencia nula), $event.detail.value ?? '', para cuando value sea null o undefined, la asignamos como ''-->
    <ion-input
      [value]="busqueda()"
      (ionInput)="busqueda.set($event.detail.value ?? '')"
      placeholder="Buscar elemento...">
    </ion-input>
  </ion-item>

  <ion-list>
    <!-- TODO - Los computed se llaman como funciones: elementosFiltrados() -->
    <!-- @for de elementosFiltrados -->
    @for (elemento of elementosFiltrados(); track elemento.id) {
      <!--cuando hagamos click en el ion-item llamamos a verDetalle con el elemento actual-->
      <ion-item button="true" (click)="verDetalle(elemento)">
        <ion-label>
          <!--nombre-->
          <h2>{{ elemento.nombre }}</h2>
          <!--descripcion-->
          <p>{{ elemento.descripcion }}</p>
        </ion-label>
      </ion-item>
    }
  </ion-list>

  <!-- TODO - hayElementos también es computed: se llama como función hayElementos() -->
  <!-- <ion-button expand="block" [disabled]="!hayElementos" (click)="mostrarToast()"> -->
  <ion-button expand="block" [disabled]="!hayElementos()" (click)="mostrarToast()">
    Mostrar mensaje
  </ion-button>

</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-title>Footer Tarea TA01 - Angular + Ionic</ion-title>
  </ion-toolbar>
</ion-footer>
